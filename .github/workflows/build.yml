name: Build Injector EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar
        run: Expand-Archive -Path valdoria-saga-do-enzo_1.zip -DestinationPath projeto

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: |
          cd projeto/mc-injector
          npm install

      - name: Build EXE
        run: |
          cd projeto/mc-injector
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ValdoriaInjector-Setup
          path: projeto/mc-injector/dist/*.exe
